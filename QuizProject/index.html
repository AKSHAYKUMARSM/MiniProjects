<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Quiz</title>
</head>
<body>
    <div id="startMenu" class="box">
        <h1>Quiz</h1>
        <p><Strong>Topic: </Strong>Web Technology</p>
        <h5 class="highScore"></h5>
        <button id="start">Start</button>
    </div>
    <div id="quizContainer" class="box">
        <h2 id="question"></h2>
        <div id="options" class="optionContainer"></div>
        <p id="counter"></p>
        <button id="next">Next</button>
        <button class="menu">Main Menu</button>
    </div>
    <div id="result" class="box">
        <h3 id="score"></h3>
        <h5 class="highScore"></h5>
        <button id="restart">Restart</button>
        <button class="menu">Main Menu</button>
    </div>
</body>
</html>
